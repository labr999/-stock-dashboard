<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 股票決策儀表板</title>
<style>
:root{
  color-scheme: dark;
  --bg:#080b13; --panel:#0d1220; --panel2:#0a0e19; --line:#1b2439;
  --ink:#e9edf7; --sub:#7c88a6; --accent:#22d3c9; --accent2:#f2a950;
  --up:#ef5b5b; --down:#3fbf6f; --violet:#8b7bff;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;}
.wrap{max-width:1240px;margin:0 auto;padding:14px;}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;}
.toggle{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.toggle button{border:0;background:transparent;color:var(--sub);padding:7px 14px;font-size:12px;cursor:pointer;font-weight:600;}
.toggle button.active{background:var(--accent);color:#04201d;}
.idxstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px;}
.idx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.idx .lab{font-size:12px;color:var(--sub);}
.idx .val{font-size:22px;font-weight:800;margin:2px 0;}
.idx .pct{font-size:12px;font-weight:700;}
.pct.up{color:var(--up);} .pct.down{color:var(--down);}
.searchbar{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
.searchbar input{flex:1;min-width:140px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;}
.searchbar button{padding:9px 16px;border-radius:8px;border:0;background:var(--accent);color:#04201d;font-weight:700;font-size:13px;cursor:pointer;}
.searchbar .note{font-size:11px;color:var(--sub);}
.quote{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;flex-wrap:wrap;}
.quote .sym{font-size:20px;font-weight:800;}
.quote .name{color:var(--sub);font-size:13px;}
.quote .price{font-size:26px;font-weight:800;}
.quote .chg{font-size:14px;font-weight:700;padding:3px 8px;border-radius:6px;}
.chg.up{color:var(--up);background:rgba(239,91,91,.12);}
.chg.down{color:var(--down);background:rgba(63,191,111,.12);}
.stat{font-size:12px;color:var(--sub);}
.stat b{color:var(--ink);font-size:13px;display:block;}
.asof{color:var(--sub);font-size:11px;margin:6px 0 12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
.card h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:700;}
.score{display:flex;align-items:center;gap:14px;}
.score .num{font-size:34px;font-weight:800;color:var(--accent);}
.score .lab{font-size:12px;color:var(--sub);}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--accent2);border:1px solid var(--line);margin-left:6px;}
.rows{display:flex;flex-direction:column;gap:8px;font-size:13px;}
.rows .r{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px;}
.rows .r span:last-child{font-weight:700;}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:4px;}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent);}
.srline{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px;}
.foot{margin-top:14px;color:var(--sub);font-size:11px;text-align:center;}
canvas{width:100%;height:150px;display:block;}
.legend{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-top:6px;flex-wrap:wrap;}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;}
.wlcard{margin-top:12px;}
.wltabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;}
.wltabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel2);color:var(--sub);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;}
.wltabs button.active{background:var(--accent);color:#04201d;border-color:var(--accent);}
.addrow{display:flex;gap:8px;margin-bottom:10px;}
.addrow input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;}
.addrow button{padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:#04201d;font-weight:700;cursor:pointer;}
.wlrow{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:13px;}
.wlrow .l div:first-child{font-weight:700;}
.wlrow .l div:last-child{font-size:11px;color:var(--sub);}
.wlrow .r{display:flex;align-items:center;gap:10px;}
.wlrow .r .p{font-weight:700;}
.wlrow .r .p.up{color:var(--up);} .wlrow .r .p.down{color:var(--down);}
.wlrow .r .x{cursor:pointer;color:var(--sub);font-weight:700;}
.wlrow.pending .r .p{color:var(--sub);font-weight:400;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>AI 股票決策儀表板 <span class="badge" id="liveBadge" style="display:none">自動更新中</span></h1>
    <div class="toggle" id="marketToggle">
      <button data-m="ALL" class="active">全部</button>
      <button data-m="TW">🇹🇼 台股</button>
      <button data-m="US">🇺🇸 美股</button>
    </div>
  </div>

  <div class="idxstrip" id="idxStrip"></div>

  <div class="searchbar">
    <input id="searchInput" placeholder="輸入股票代號查詢，如 2330 或 AAPL">
    <button id="searchBtn">查詢</button>
    <span class="note" id="searchNote">資料來源：證交所 TWSE ／ Yahoo Finance（同步自 data.json）</span>
  </div>

  <div class="quote" id="quote"></div>
  <div class="asof" id="asof"></div>

  <div class="grid">
    <div class="card">
      <h3>AI 決策核心</h3>
      <div class="score"><div class="num" id="scoreNum">--</div><div class="lab">綜合評分（0–100）<span class="badge" id="scoreGrade">B</span></div></div>
      <div class="rows" style="margin-top:12px" id="coreRows"></div>
      <div class="rows" style="margin-top:8px"><div class="r"><span>KD 值（近似）</span><span id="kdVal">--</span></div></div>
    </div>

    <div class="card">
      <h3>K 線走勢（近期）</h3>
      <canvas id="klineCanvas" width="500" height="150"></canvas>
      <div class="legend"><span><i style="background:var(--up)"></i>收盤</span><span><i style="background:var(--accent)"></i>MA5</span></div>
      <div class="srline"><span>支撐 <b id="supVal"></b></span><span>壓力 <b id="resVal"></b></span></div>
    </div>

    <div class="card">
      <h3>多維度判讀</h3>
      <canvas id="radarCanvas" width="300" height="220"></canvas>
    </div>

    <div class="card">
      <h3>資金流向</h3>
      <div id="flowCardBody">
        <canvas id="flowCanvas" width="500" height="150"></canvas>
        <div class="legend" id="flowLegend"></div>
      </div>
    </div>

    <div class="card">
      <h3>籌碼與健康度</h3>
      <div class="rows" id="chipRows"></div>
    </div>

    <div class="card">
      <h3>市場情緒 / 信心度</h3>
      <div class="rows" id="sentRows"></div>
    </div>
  </div>

  <div class="card wlcard">
    <h3>六組自選清單（儲存於此裝置）</h3>
    <div class="wltabs" id="wlTabs"></div>
    <div class="addrow">
      <input id="addInput" placeholder="輸入代號加入本組，如 2317 或 AMD">
      <button id="addBtn">+ 加入</button>
    </div>
    <div id="wlRows"></div>
  </div>

  <div class="foot">四大指數與個股報價為 Yahoo Finance／證交所資料快照（透過 fetch_stocks.py 排程同步到 data.json，非瀏覽器即時直連）。K線、雷達、資金流、KD 為簡化示意計算，非正式技術分析依據。</div>
</div>

<script>
const STOCKS = [
  { market:"TW", sym:"6933", name:"AMAX-KY", price:143.00, chg:0.50, pct:0.35,
    asOf:"2026/01/27 開盤・Yahoo奇摩股市", stats:[["成交量","65"],["本益比","25.63"],["市值(百萬)","6,077.94"],["董監持股","58.09%"],["集團","鴻海"]],
    score:60, grade:"B", core:[["趨勢判斷","中性偏多"],["短期狀態","區間震盪"],["主力行為","調節減碼"],["籌碼結構","偏弱"],["風險等級","1～2級"]],
    kline:[300,305,318,330,325,340,352,348,360,355,349,358,362,357,346,350,343,338,345,142,143],
    radar:{labels:["趨勢","動能","籌碼","波動性","流動性"], vals:[55,60,48,65,72]},
    flow:{labels:["09/15","09/16","09/17","09/18","09/19"], series:[
      {name:"外資", color:"var(--up)", vals:[-92,-82,-181,-40,20]},
      {name:"投信", color:"var(--accent2)", vals:[0,0,0,3,1]},
      {name:"自營商", color:"var(--violet)", vals:[-3,-11,-3,-8,2]}]},
    chips:[["主力平均成本","300.82（20日VWAP）"],["籌碼健康度","37分（偏弱）"],["支撐/壓力","135.00 / 185.00"],["隔日沖比重","73%"]],
    sent:[["AI信心指數","55%"],["法人資金流","37%"],["散戶情緒","65%"],["市場情緒","中性"]] },

  { market:"US", sym:"NVDA", name:"NVIDIA Corp", price:225.11, chg:-0.42, pct:-0.19,
    asOf:"2026/08/18 close・market data", stats:[["Volume","23.67M"],["Open","225.53"],["High","227.92"],["Low","224.86"],["YTD","164.28–236.54"]],
    score:74, grade:"A-", core:[["Trend","Bullish"],["Short-term","Breakout"],["Institution flow","Accumulating"],["Chip structure","Strong"],["Risk level","Lv.2"]],
    kline:[150,155,158,162,159,165,170,168,175,172,178,176,181,179,183,180,177,225,227,225,225],
    radar:{labels:["Trend","Momentum","Chips","Volatility","Liquidity"], vals:[78,82,70,55,90]},
    flow:{labels:["09/15","09/16","09/17","09/18","09/19"], series:[
      {name:"Institutional", color:"var(--down)", vals:[120,95,180,60,40]},
      {name:"ETF flow", color:"var(--accent2)", vals:[10,20,15,8,12]},
      {name:"Options net", color:"var(--violet)", vals:[30,-10,20,15,25]}]},
    chips:[["Avg cost basis","$168.40 (20D VWAP)"],["Chip health","82 (Strong)"],["Support/Resist.","$165 / $190"],["Short interest","4.2%"]],
    sent:[["AI Confidence","74%"],["Institutional flow","68%"],["Retail sentiment","61%"],["Market mood","Risk-on"]] },

  { market:"TW", sym:"2330", name:"台積電", price:1485.00, chg:15.00, pct:1.02, placeholder:true,
    asOf:"示範樣本・尚未排程抓取", stats:[["成交量","5,161"],["本益比","-"],["市值(百萬)","-"],["董監持股","-"],["集團","-"]],
    score:68, grade:"B+", core:[["趨勢判斷","偏多"],["短期狀態","盤堅"],["主力行為","持續買超"],["籌碼結構","中性"],["風險等級","1級"]],
    kline:[1400,1410,1420,1435,1450,1440,1460,1470,1465,1480,1475,1485],
    radar:{labels:["趨勢","動能","籌碼","波動性","流動性"], vals:[70,65,60,40,95]},
    flow:{labels:["09/15","09/16","09/17","09/18","09/19"], series:[
      {name:"外資", color:"var(--up)", vals:[50,30,80,20,40]},{name:"投信", color:"var(--accent2)", vals:[5,2,3,1,4]},{name:"自營商", color:"var(--violet)", vals:[-2,3,1,-1,2]}]},
    chips:[["主力平均成本","1,380（示範）"],["籌碼健康度","70分"],["支撐/壓力","1,400 / 1,520"],["隔日沖比重","20%"]],
    sent:[["AI信心指數","68%"],["法人資金流","72%"],["散戶情緒","55%"],["市場情緒","偏多"]] },

  { market:"US", sym:"AAPL", name:"Apple Inc", price:238.40, chg:-1.20, pct:-0.50, placeholder:true,
    asOf:"示範樣本・尚未排程抓取", stats:[["Volume","-"],["Open","-"],["High","-"],["Low","-"],["YTD","-"]],
    score:58, grade:"B", core:[["Trend","Sideways"],["Short-term","Range"],["Institution flow","Neutral"],["Chip structure","Neutral"],["Risk level","Lv.1"]],
    kline:[230,232,235,233,238,236,240,239,241,238,237,238],
    radar:{labels:["Trend","Momentum","Chips","Volatility","Liquidity"], vals:[55,50,52,35,88]},
    flow:{labels:["09/15","09/16","09/17","09/18","09/19"], series:[
      {name:"Institutional", color:"var(--down)", vals:[10,-5,15,5,-3]},{name:"ETF flow", color:"var(--accent2)", vals:[3,4,2,1,2]},{name:"Options net", color:"var(--violet)", vals:[-5,3,2,-2,1]}]},
    chips:[["Avg cost basis","$225（demo）"],["Chip health","58"],["Support/Resist.","$225 / $245"],["Short interest","1.1%"]],
    sent:[["AI Confidence","58%"],["Institutional flow","50%"],["Retail sentiment","60%"],["Market mood","Neutral"]] }
];

const INDEXES_SEED = [
  {label:"台灣加權", value:47368.04, pct:3.28},
  {label:"道瓊工業", value:51682.64, pct:-1.69},
  {label:"那斯達克", value:26522.55, pct:0.72},
  {label:"費城半導體", value:11921.69, pct:0.83}
];
let INDEXES = INDEXES_SEED;

const DEFAULT_GROUPS = {
  "台股核心": [["TW","6933"],["TW","2330"]],
  "台股AI": [["TW","2330"]],
  "美股科技": [["US","NVDA"],["US","AAPL"]],
  "美股半導體": [["US","NVDA"]],
  "美股成長": [["US","AAPL"]],
  "我的觀察": []
};
function loadGroups(){
  try{ const raw = localStorage.getItem("wlGroups"); if(raw) return JSON.parse(raw); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_GROUPS));
}
function saveGroups(){ try{ localStorage.setItem("wlGroups", JSON.stringify(GROUPS)); }catch(e){} }
let GROUPS = loadGroups();
let activeGroup = Object.keys(GROUPS)[0];

let marketFilter = "ALL";
let selected = 0;

function findStock(sym){
  const s = sym.trim().toUpperCase();
  return STOCKS.findIndex(x=>x.sym.toUpperCase()===s);
}
function guessMarket(sym){ return /^\d+$/.test(sym) ? "TW" : "US"; }
function fmtNum(n){ return (n>0?"+":"") + n.toFixed(2); }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function resolveColor(v){ return v.startsWith("var(") ? css(v.slice(4,-1)) : v; }

function renderIndexStrip(){
  document.getElementById("idxStrip").innerHTML = INDEXES.map(i=>{
    const up = i.pct>=0;
    return `<div class="idx"><div class="lab">${i.label}</div><div class="val">${i.value.toLocaleString(undefined,{maximumFractionDigits:2})}</div><div class="pct ${up?'up':'down'}">${fmtNum(i.pct)}%</div></div>`;
  }).join("");
}

function renderGroupTabs(){
  const el = document.getElementById("wlTabs");
  el.innerHTML = Object.keys(GROUPS).map(g=>`<button data-g="${g}" class="${g===activeGroup?'active':''}">${g}</button>`).join("");
  el.querySelectorAll("button").forEach(b=> b.onclick = ()=>{ activeGroup=b.dataset.g; render(); });
}

function renderGroupRows(){
  const el = document.getElementById("wlRows");
  const items = GROUPS[activeGroup] || [];
  if(items.length===0){ el.innerHTML = '<div class="wl-empty" style="color:var(--sub);font-size:12px;padding:8px 4px;">這組還沒有股票，用上面輸入框加入。</div>'; return; }
  el.innerHTML = items.map(([mkt,sym],idx)=>{
    const i = STOCKS.findIndex(s=>s.market===mkt && s.sym===sym);
    if(i===-1){
      return `<div class="wlrow pending"><div class="l"><div>${sym}</div><div>${mkt==="TW"?"台股":"美股"}・尚未加入資料來源</div></div><div class="r"><span class="p">等待報價</span><span class="x" data-rm="${idx}">×</span></div></div>`;
    }
    const s = STOCKS[i]; const up = s.chg>=0;
    return `<div class="wlrow" data-sel="${i}"><div class="l"><div>${s.sym}${s.placeholder?' <span style="color:var(--sub);font-weight:400">(示範)</span>':''}</div><div>${s.name}</div></div><div class="r"><span class="p ${up?'up':'down'}">${s.price} ${fmtNum(s.pct)}%</span><span class="x" data-rm="${idx}">×</span></div></div>`;
  }).join("");
  el.querySelectorAll("[data-sel]").forEach(node=> node.onclick = (e)=>{ if(e.target.classList.contains('x')) return; selected = parseInt(node.dataset.sel); render(); });
  el.querySelectorAll("[data-rm]").forEach(node=> node.onclick = ()=>{ GROUPS[activeGroup].splice(parseInt(node.dataset.rm),1); saveGroups(); render(); });
}

function computeKD(closes){
  if(closes.length<9) return "--";
  const period = closes.slice(-9);
  const low = Math.min(...period), high = Math.max(...period);
  const rsv = high===low ? 50 : (closes[closes.length-1]-low)/(high-low)*100;
  return "K " + rsv.toFixed(0) + " / D " + (rsv*0.7+30*0.3).toFixed(0); // 簡化近似，非標準遞迴KD
}

function render(){
  renderIndexStrip();
  renderGroupTabs();
  renderGroupRows();

  const d = STOCKS[selected];
  const up = d.chg >= 0;
  document.getElementById("quote").innerHTML = `
    <div class="sym">${d.sym}</div>
    <div class="name">${d.name}</div>
    <div class="price">${d.price}</div>
    <div class="chg ${up?'up':'down'}">${fmtNum(d.chg)} (${fmtNum(d.pct)}%)</div>
    ${d.stats.map(s=>`<div class="stat">${s[0]}<b>${s[1]}</b></div>`).join("")}
  `;
  document.getElementById("asof").textContent = "資料時間：" + d.asOf;
  document.getElementById("scoreNum").textContent = d.score;
  document.getElementById("scoreGrade").textContent = d.grade;
  document.getElementById("coreRows").innerHTML = d.core.map(r=>`<div class="r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
  document.getElementById("kdVal").textContent = computeKD(d.kline);
  document.getElementById("chipRows").innerHTML = d.chips.map(r=>`<div class="r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
  document.getElementById("sentRows").innerHTML = d.sent.map(r=>{
    const isPct = /%$/.test(r[1]); const pct = isPct ? parseFloat(r[1]) : null;
    return `<div class="r"><span>${r[0]}</span><span>${r[1]}</span></div>` + (isPct ? `<div class="bar"><i style="width:${pct}%"></i></div>` : "");
  }).join("");
  document.getElementById("supVal").textContent = Math.min(...d.kline).toFixed(2);
  document.getElementById("resVal").textContent = Math.max(...d.kline).toFixed(2);
  drawKline(d.kline);
  drawRadar(d.radar);
  renderFlowCard(d);
}

function renderFlowCard(d){
  const card = document.getElementById("flowCardBody");
  if(d.institutional){
    const i = d.institutional;
    const row = (lab,v)=>{
      if(v==null) return `<div class="r"><span>${lab}</span><span>－</span></div>`;
      const up = v>=0;
      return `<div class="r"><span>${lab}</span><span style="color:${up?resolveColor('var(--up)'):resolveColor('var(--down)')}">${up?'+':''}${v.toLocaleString()} 股</span></div>`;
    };
    card.innerHTML = `<div class="rows">
      ${row("外資買賣超", i.foreign_net)}
      ${row("投信買賣超", i.trust_net)}
      ${row("自營商買賣超", i.dealer_net)}
    </div><div style="font-size:11px;color:var(--sub);margin-top:8px">來源：證交所 T86，最新交易日快照</div>`;
  } else {
    card.innerHTML = `<canvas id="flowCanvas" width="500" height="150"></canvas><div class="legend" id="flowLegend"></div>`;
    drawFlow(d.flow);
  }
}

function drawKline(vals){
  const c = document.getElementById("klineCanvas"); const ctx = c.getContext("2d");
  const W=c.width,H=c.height,pad=10; ctx.clearRect(0,0,W,H);
  const min=Math.min(...vals),max=Math.max(...vals);
  const x=i=>pad+i*(W-2*pad)/(vals.length-1); const y=v=>H-pad-(v-min)/(max-min||1)*(H-2*pad);
  ctx.strokeStyle=resolveColor("var(--up)"); ctx.lineWidth=2; ctx.beginPath();
  vals.forEach((v,i)=> i===0?ctx.moveTo(x(i),y(v)):ctx.lineTo(x(i),y(v))); ctx.stroke();
  ctx.lineTo(x(vals.length-1),H-pad); ctx.lineTo(x(0),H-pad); ctx.closePath();
  ctx.fillStyle=resolveColor("var(--up)")+"22"; ctx.fill();
  const ma5=vals.map((_,i,arr)=> i<4?null: arr.slice(i-4,i+1).reduce((a,b)=>a+b,0)/5);
  ctx.strokeStyle=resolveColor("var(--accent)"); ctx.lineWidth=1.5; ctx.beginPath();
  let started=false;
  ma5.forEach((v,i)=>{ if(v==null) return; if(!started){ctx.moveTo(x(i),y(v)); started=true;} else ctx.lineTo(x(i),y(v)); });
  ctx.stroke();
}

function drawRadar(radar){
  const c=document.getElementById("radarCanvas"); const ctx=c.getContext("2d");
  const W=c.width,H=c.height,cx=W/2,cy=H/2-6,R=Math.min(W,H)/2-30; ctx.clearRect(0,0,W,H);
  const n=radar.labels.length;
  ctx.strokeStyle=css("--line"); ctx.fillStyle=css("--sub"); ctx.font="10px sans-serif";
  for(let ring=1;ring<=4;ring++){ ctx.beginPath();
    for(let i=0;i<=n;i++){ const ang=-Math.PI/2+i*2*Math.PI/n; const r=R*ring/4;
      const px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang); i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
    ctx.stroke(); }
  radar.labels.forEach((lab,i)=>{ const ang=-Math.PI/2+i*2*Math.PI/n;
    const px=cx+(R+14)*Math.cos(ang),py=cy+(R+14)*Math.sin(ang); ctx.textAlign="center"; ctx.fillText(lab,px,py); });
  ctx.beginPath();
  radar.vals.forEach((v,i)=>{ const ang=-Math.PI/2+i*2*Math.PI/n; const r=R*v/100;
    const px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang); i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); });
  ctx.closePath(); ctx.fillStyle=resolveColor("var(--accent)")+"33"; ctx.strokeStyle=resolveColor("var(--accent)"); ctx.lineWidth=2; ctx.fill(); ctx.stroke();
}

function drawFlow(flow){
  const c=document.getElementById("flowCanvas"); const ctx=c.getContext("2d");
  const W=c.width,H=c.height,pad=24; ctx.clearRect(0,0,W,H);
  const allVals=flow.series.flatMap(s=>s.vals); const maxAbs=Math.max(...allVals.map(Math.abs),1);
  const groupW=(W-2*pad)/flow.labels.length; const zeroY=H/2;
  ctx.strokeStyle=css("--line"); ctx.beginPath(); ctx.moveTo(pad,zeroY); ctx.lineTo(W-pad,zeroY); ctx.stroke();
  flow.labels.forEach((lab,gi)=>{ const gx=pad+gi*groupW; const barW=groupW/(flow.series.length+1);
    flow.series.forEach((s,si)=>{ const v=s.vals[gi]; const h=(Math.abs(v)/maxAbs)*(H/2-pad); const bx=gx+si*barW+barW/2;
      ctx.fillStyle=resolveColor(s.color);
      if(v>=0) ctx.fillRect(bx,zeroY-h,barW*0.7,h); else ctx.fillRect(bx,zeroY,barW*0.7,h); });
    ctx.fillStyle=css("--sub"); ctx.font="10px sans-serif"; ctx.textAlign="center"; ctx.fillText(lab,gx+groupW/2,H-6); });
  document.getElementById("flowLegend").innerHTML = flow.series.map(s=>`<span><i style="background:${resolveColor(s.color)}"></i>${s.name}</span>`).join("");
}

function scoreToGrade(s){ if(s>=85)return "A"; if(s>=75)return "A-"; if(s>=65)return "B+"; if(s>=55)return "B"; if(s>=45)return "B-"; if(s>=35)return "C+"; return "C"; }
function genStockFromRecord(mkt, rec){
  const cleanSym = rec.symbol.replace(/\.(TW|TWO)$/,"");
  const pct = rec.pct || 0;
  const score = Math.max(15, Math.min(90, Math.round(50 + pct*4)));
  const kline = (rec.kline && rec.kline.length>1) ? rec.kline : [rec.price, rec.price];
  const lo = Math.min(...kline), hi = Math.max(...kline);
  const vol = Number(String(rec.volume).replace(/,/g,"")) || 0;
  const inst = rec.institutional, marg = rec.margin;
  return {
    market: mkt, sym: cleanSym, name: NAME_MAP[cleanSym] || cleanSym,
    price: rec.price, chg: rec.change, pct: rec.pct,
    asOf: rec.as_of + "（自動更新・yfinance）",
    stats: [["成交量/Vol", rec.volume?.toLocaleString?.() ?? rec.volume], ["開盤/Open", rec.open], ["最高/High", rec.high], ["最低/Low", rec.low], ["MA5", rec.ma5 ?? "-"]],
    score, grade: scoreToGrade(score),
    core: [["趨勢判斷", pct>=0?"偏多":"偏弱"], ["短期狀態", Math.abs(pct)>3?"劇烈波動":"區間震盪"],
           ["主力行為", inst ? (inst.foreign_net>0?"外資買超":"外資賣超") : "尚未串接法人資料"],
           ["籌碼結構","中性（示意）"], ["風險等級", Math.abs(pct)>5?"3級":"1～2級"]],
    kline,
    radar: {labels:["趨勢","動能","籌碼","波動性","流動性"],
      vals:[Math.max(0,Math.min(100,50+pct*3)), Math.max(0,Math.min(100,50+pct*4)), 50,
            Math.max(0,Math.min(100, (hi-lo)/(hi||1)*300)), Math.max(0,Math.min(100, Math.log10(vol+1)*12))]},
    institutional: inst || null,
    margin: marg || null,
    flow: {labels:["D-4","D-3","D-2","D-1","D0"], series:[
      {name:"外資（未串接）", color:"var(--up)", vals:[0,0,0,0,0]},
      {name:"投信（未串接）", color:"var(--accent2)", vals:[0,0,0,0,0]},
      {name:"自營商（未串接）", color:"var(--violet)", vals:[0,0,0,0,0]}]},
    chips: marg ? [["支撐/壓力", lo.toFixed(2)+" / "+hi.toFixed(2)],
                   ["融資餘額", marg.margin_balance!=null? marg.margin_balance.toLocaleString()+" 股" : "－"],
                   ["融券餘額", marg.short_balance!=null? marg.short_balance.toLocaleString()+" 股" : "－"],
                   ["籌碼健康度","中性（示意）"]]
                : [["支撐/壓力", lo.toFixed(2)+" / "+hi.toFixed(2)], ["籌碼健康度","中性（示意）"], ["主力平均成本","－ 尚未串接"], ["隔日沖比重","－"]],
    sent: [["AI信心指數", score+"%"], ["法人資金流", inst ? (inst.foreign_net>0?"買超":"賣超") : "－"], ["散戶情緒","－"], ["市場情緒", pct>=0?"偏多":"偏弱"]]
  };
}

async function loadLiveData(){
  try{
    const res = await fetch("./data.json", {cache:"no-store"});
    if(!res.ok) throw new Error("no data.json");
    const json = await res.json();
    let any=false;
    if(Array.isArray(json.indexes) && json.indexes.length){
      INDEXES = json.indexes.map(i=>({label: i.label==="TAIEX"?"台灣加權": i.label==="DJI"?"道瓊工業": i.label==="IXIC"?"那斯達克": i.label==="SOX"?"費城半導體": i.label, value:i.value, pct:i.pct}));
    }
    ["TW","US"].forEach(mkt=>{
      (json[mkt]||[]).forEach(rec=>{
        const cleanSym = rec.symbol.replace(/\.(TW|TWO)$/,"");
        const target = STOCKS.find(s=>s.market===mkt && s.sym===cleanSym);
        any = true;
        if(target){
          target.placeholder = false;
          target.price = rec.price; target.chg = rec.change; target.pct = rec.pct;
          target.asOf = rec.as_of + "（自動更新・yfinance）";
          target.stats = [["成交量/Vol", rec.volume.toLocaleString()], ["開盤/Open", rec.open], ["最高/High", rec.high], ["最低/Low", rec.low], ["MA5", rec.ma5 ?? "-"]];
          if(rec.kline && rec.kline.length>1) target.kline = rec.kline;
          target.institutional = rec.institutional || null;
          target.margin = rec.margin || null;
          if(rec.margin){
            const lo=Math.min(...target.kline), hi=Math.max(...target.kline);
            target.chips = [["支撐/壓力", lo.toFixed(2)+" / "+hi.toFixed(2)],
                             ["融資餘額", rec.margin.margin_balance!=null? rec.margin.margin_balance.toLocaleString()+" 股" : "－"],
                             ["融券餘額", rec.margin.short_balance!=null? rec.margin.short_balance.toLocaleString()+" 股" : "－"],
                             ["籌碼健康度","中性（示意）"]];
          }
        } else {
          STOCKS.push(genStockFromRecord(mkt, rec));
        }
      });
    });
    if(any) document.getElementById("liveBadge").style.display = "inline-block";
  }catch(e){ /* data.json 還沒生成，或跨網域被擋 → 維持內建樣本 */ }
  render();
}
loadLiveData();
