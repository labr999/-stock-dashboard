name: Update Stock Data

on:
  schedule:
    # 台股 09:00-13:30、美股 21:30-04:00（台北時間），這裡先抓平日每30分鐘一次
    # cron 用 UTC，台北時間 = UTC+8
    - cron: "*/30 1,2,3,4,5,6,7,13,14,15,16,17,18,19,20 * * 1-5"
  workflow_dispatch: {}  # 允許手動觸發，方便在 GitHub App 上按一下就測試

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch stock data
        run: python fetch_stocks.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update stock data.json"
          git push
